            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --accent: #5eead4;

        * { box-sizing: border-box; }
        body {

            font-family: "Montserrat", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            color: var(--text-main);
            background: var(--bg);
            background-attachment: fixed;
            padding: 2.4rem 1.2rem 3rem;
        }
        .page { max-width: 980px; margin: 0 auto; }
        .title { background: linear-gradient(115deg, rgba(56, 189, 248, 0.15), rgba(14, 165, 233, 0.04)); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 18px; padding: 1.5rem 1.7rem; margin-bottom: 1.6rem; backdrop-filter: blur(8px); box-shadow: 0 24px 60px rgba(2, 6, 23, 0.45); }

        .subtitle { margin-top: 0.6rem; color: var(--text-sub); font-size: 0.98rem; line-height: 1.5; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .platform-card { background: var(--panel); border: 1px solid rgba(148, 163, 184, 0.23); border-radius: 16px; padding: 1rem; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 12px 30px rgba(2, 6, 23, 0.45); transform-origin: center; animation: floatIn 0.45s ease both; }
        .platform-card h2 { margin: 0; font-size: 1.08rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
        .platform-card ul { margin: 0.8rem 0 0; padding: 0; list-style: none; }
        .platform-card li + li { margin-top: 0.58rem; }
        .platform-card a { display: inline-flex; width: 100%; align-items: center; justify-content: space-between; text-decoration: none; color: var(--text-main); padding: 0.58rem 0.72rem; border-radius: 10px; border: 1px solid rgba(148, 163, 184, 0.25); background: linear-gradient(180deg, rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.55)); transition: all 0.2s ease; }
        .platform-card a:hover, .platform-card a:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); transform: translateY(-1px); color: #fff; }
        .platform-badge { margin-top: 0.9rem; padding: 0.4rem 0.6rem; display: inline-block; font-size: 0.74rem; border-radius: 999px; background: var(--panel-2); color: #bae6fd; border: 1px solid rgba(148, 163, 184, 0.3); }
        #git { padding: 1.5rem 1.7rem; display: flex; flex-direction: column; gap: 5px; justify-content: center; align-items: center; color: #d8fbff; fill: #d8fbff; }
		#git a { display: flex; width: 200px; max-width: 100%; height: 44px; justify-content: center; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
		#git a svg, #git a img { width: 24px; height: 24px; flex-shrink: 0; }
        @media (max-width: 560px) { body { padding: 1rem 0.8rem 2.2rem; } .title { border-radius: 14px; } }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(12px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .platform-card:nth-child(1) { animation-delay: 0.03s; }
        .platform-card:nth-child(2) { animation-delay: 0.07s; }
        .platform-card:nth-child(3) { animation-delay: 0.11s; }
        .platform-card:nth-child(4) { animation-delay: 0.15s; }
        .platform-card:nth-child(5) { animation-delay: 0.19s; }
        .platform-card:nth-child(6) { animation-delay: 0.23s; }
        .platform-card:nth-child(7) { animation-delay: 0.27s; }
